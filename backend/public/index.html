<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>XO.io — Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0e0e0e;
      --surface: #191919;
      --border: #2a2a2a;
      --text: #d1d0c5;
      --muted: #646669;
      --strong: #e2e2e2;
      --copy-hint: #3a3a3a;
      --turn-inactive: #2a2a2a;
      --cell-bg: #0e0e0e;
      --font-mono: 'Roboto Mono', monospace;
      --font-display: 'Space Mono', monospace;
      --transition-theme: background 0.25s, color 0.25s, border-color 0.25s;
    }

    :root.light {
      --bg: #f0efeb;
      --surface: #e4e3de;
      --border: #c9c8c3;
      --text: #3a3a35;
      --muted: #8a8985;
      --strong: #1a1a18;
      --copy-hint: #b0afaa;
      --turn-inactive: #c9c8c3;
      --cell-bg: #f0efeb;
    }

    html, body {
      height: 100%;
      transition: var(--transition-theme);
    }

    body {
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Layout ── */
    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--strong);
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--muted); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-height: auto;
      transition: border-color 0.15s, color 0.15s, background 0.25s;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .theme-toggle:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .theme-toggle .icon {
      font-size: 12px;
      line-height: 1;
    }

    .status-pill {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }

    .status-pill.online { color: var(--text); }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; align-items: center; gap: 1.25rem; width: 100%; }
    .screen.active { display: flex; }

    /* ── Labels ── */
    .label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
    }

    /* ── Buttons ── */
    button {
      font-family: var(--font-mono);
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 18px;
      min-height: 40px;
    }

    .btn:hover { border-color: var(--muted); color: var(--text); }

    .btn.primary {
      border-color: var(--text);
      color: var(--text);
    }

    .btn.primary:hover {
      background: var(--text);
      color: var(--bg);
    }

    .btn.full { width: 100%; }

    /* ── Input ── */
    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 14px;
      outline: none;
      letter-spacing: 3px;
      text-transform: uppercase;
      min-height: 40px;
      -webkit-appearance: none;
    }

    input[type="text"]::placeholder {
      color: var(--muted);
      letter-spacing: 0;
      text-transform: none;
    }

    input[type="text"]:focus { border-color: var(--text); }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Wait screen ── */
    .room-big {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 8px;
      text-align: center;
    }

    .copy-link {
      font-size: 11px;
      color: var(--copy-hint);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
      min-height: auto;
    }

    .copy-link:hover { color: var(--muted); }

    .dots-loader {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .dots-loader span {
      width: 5px;
      height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: pulse-dot 1.2s ease-in-out infinite;
      display: inline-block;
    }

    .dots-loader span:nth-child(2) { animation-delay: 0.2s; }
    .dots-loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ── QR (only shown while waiting) ── */
    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .qr-box {
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
    }

    .qr-box img {
      width: 120px;
      height: 120px;
      display: block;
    }

    /* ── Game screen ── */
    .turn-row {
      display: flex;
      gap: 28px;
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .turn-player {
      color: var(--turn-inactive);
      transition: color 0.2s;
      padding-bottom: 3px;
      background: none;
      border: none;
      cursor: default;
      min-height: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .turn-player.active {
      color: var(--text);
      border-bottom: 1px solid var(--text);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--surface);
      border-radius: 10px;
      padding: 4px;
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1;
    }

    .cell {
      background: var(--bg);
      border: none;
      border-radius: 7px;
      font-family: var(--font-display);
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      min-height: unset;
    }

    .cell:hover:not(:disabled):not(.filled) { background: var(--surface); }
    .cell:disabled { cursor: default; }
    .cell.x-sym { color: var(--strong); }
    .cell.o-sym { color: var(--muted); }

    .game-msg {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      min-height: 16px;
      text-align: center;
    }

    .game-msg.active { color: var(--text); }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── Result screen ── */
    .result-word {
      font-family: var(--font-display);
      font-size: clamp(36px, 12vw, 56px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
    }

    .result-word.win { color: var(--strong); }
    .result-word.lose { color: var(--border); }
    .result-word.draw { color: var(--muted); }

    .result-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* ── Room info badge (in game) ── */
    .room-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .room-badge strong {
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--text);
      letter-spacing: 3px;
    }

    /* ── Mobile safe area ── */
    @media (max-width: 400px) {
      body { padding: 0.75rem; }
      .board { max-width: 260px; }
    }

    @media (max-height: 640px) {
      .app { gap: 1rem; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">XO<span>.</span>io</div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <span class="icon" id="themeIcon">○</span>
        <span id="themeLabel">light</span>
      </button>
      <div class="status-pill" id="statusPill">connecting</div>
    </div>
  </div>

  <!-- ── Join screen ── -->
  <div class="screen active" id="joinScreen">
    <div class="label">create a new game</div>
    <button class="btn primary full" onclick="createNewGame()">new game</button>
    <div class="divider">or join existing</div>
    <div class="input-row">
      <input type="text" id="roomInput" placeholder="enter room id" maxlength="6" />
      <button class="btn" onclick="joinExistingGame()">join</button>
    </div>
  </div>

  <!-- ── Waiting screen (shown to creator before opponent joins) ── -->
  <div class="screen" id="waitScreen">
    <div class="label">share this room id</div>
    <div class="room-big" id="waitRoomCode">——</div>
    <button class="copy-link" id="copyBtn" onclick="copyRoomLink()">[ click to copy invite link ]</button>

    <div class="qr-wrap">
      <div class="label">or scan to join</div>
      <div class="qr-box" id="qrBox">
        <span style="font-size:11px;color:#999">loading…</span>
      </div>
    </div>

    <div class="dots-loader"><span></span><span></span><span></span></div>
    <div class="label">waiting for opponent</div>
    <button class="btn" onclick="cancelWait()">cancel</button>
  </div>

  <!-- ── Game screen ── -->
  <div class="screen" id="gameScreen">
    <div class="room-badge">
      room <strong id="gameRoomCode">——</strong>
    </div>

    <div class="turn-row">
      <button class="turn-player" id="yourTurnEl">you (X)</button>
      <button class="turn-player" id="oppTurnEl">opponent (O)</button>
    </div>

    <div class="board" id="board">
      <button class="cell" data-index="0" onclick="makeMove(0)"></button>
      <button class="cell" data-index="1" onclick="makeMove(1)"></button>
      <button class="cell" data-index="2" onclick="makeMove(2)"></button>
      <button class="cell" data-index="3" onclick="makeMove(3)"></button>
      <button class="cell" data-index="4" onclick="makeMove(4)"></button>
      <button class="cell" data-index="5" onclick="makeMove(5)"></button>
      <button class="cell" data-index="6" onclick="makeMove(6)"></button>
      <button class="cell" data-index="7" onclick="makeMove(7)"></button>
      <button class="cell" data-index="8" onclick="makeMove(8)"></button>
    </div>

    <div class="game-msg" id="gameMsg">—</div>

    <div class="action-row">
      <button class="btn" onclick="newGame()">home</button>
    </div>
  </div>

  <!-- ── Result screen ── -->
  <div class="screen" id="resultScreen">
    <div class="result-word" id="resultWord">draw</div>
    <div class="result-sub" id="resultSub">game over</div>
    <div class="action-row">
      <button class="btn primary" onclick="playAgain()">play again</button>
      <button class="btn" onclick="newGame()">home</button>
    </div>
  </div>

</div>

<!-- winner overlay (kept for compatibility, but hidden via new result screen) -->
<div id="winnerBackdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:998;"></div>
<div id="winnerMessage" style="display:none;"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  let currentRoomId = null;
  let mySymbol     = null;
  let isMyTurn     = false;
  let gameBoard    = Array(9).fill(null);

  // ── Screen navigation ──────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function setStatus(txt, online) {
    const el = document.getElementById('statusPill');
    el.textContent = txt;
    el.className = 'status-pill' + (online ? ' online' : '');
  }

  // ── QR code ───────────────────────────────────────────────────
  function generateQRCode(roomId) {
    const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
    const size = 120;
    const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(joinUrl)}&color=000000&bgcolor=ffffff&margin=1`;
    const qrBox = document.getElementById('qrBox');
    const img = document.createElement('img');
    img.src = apiUrl;
    img.width = size;
    img.height = size;
    img.alt = 'QR code';
    img.onerror = () => { qrBox.innerHTML = `<span style="font-size:11px;color:#999">QR unavailable<br>${roomId}</span>`; };
    qrBox.innerHTML = '';
    qrBox.appendChild(img);
  }

  function copyRoomLink() {
    const joinUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
    navigator.clipboard?.writeText(joinUrl).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '[ copied! ]';
      setTimeout(() => btn.textContent = '[ click to copy invite link ]', 1800);
    });
  }

  // ── Board rendering ────────────────────────────────────────────
  function updateBoard() {
    document.querySelectorAll('.cell').forEach((cell, i) => {
      const v = gameBoard[i];
      cell.textContent = v || '';
      cell.className = 'cell' + (v ? ' filled' : '') + (v === 'X' ? ' x-sym' : v === 'O' ? ' o-sym' : '');
      cell.disabled = !!v || !isMyTurn;
    });
  }

  function enableBoard()  { document.querySelectorAll('.cell').forEach((c, i) => { if (!gameBoard[i]) c.disabled = !isMyTurn; }); }
  function disableBoard() { document.querySelectorAll('.cell').forEach(c => c.disabled = true); }

  // ── Turn UI ────────────────────────────────────────────────────
  function updateTurnIndicators() {
    const oppSym = mySymbol === 'X' ? 'O' : 'X';
    const yourEl = document.getElementById('yourTurnEl');
    const oppEl  = document.getElementById('oppTurnEl');
    yourEl.textContent = `you (${mySymbol})`;
    oppEl.textContent  = `opponent (${oppSym})`;
    yourEl.classList.toggle('active', isMyTurn);
    oppEl.classList.toggle('active', !isMyTurn);
  }

  function setGameMsg(txt, highlight) {
    const el = document.getElementById('gameMsg');
    el.textContent = txt;
    el.className = 'game-msg' + (highlight ? ' active' : '');
  }

  // ── Show result screen (replaces old backdrop) ─────────────────
  function showResult(winner) {
    const words = { [mySymbol]: 'gg', draw: 'draw' };
    const subs  = { [mySymbol]: 'you won!', draw: "it's a draw" };
    const oppSym = mySymbol === 'X' ? 'O' : 'X';

    let type, wordTxt, subTxt;
    if (winner === 'draw') {
      type = 'draw'; wordTxt = 'draw'; subTxt = "it's a draw";
    } else if (winner === mySymbol) {
      type = 'win'; wordTxt = 'gg ez'; subTxt = 'you won!';
    } else {
      type = 'lose'; wordTxt = 'rekt'; subTxt = 'you lost';
    }

    document.getElementById('resultWord').textContent = wordTxt;
    document.getElementById('resultWord').className = `result-word ${type}`;
    document.getElementById('resultSub').textContent = subTxt;
    showScreen('resultScreen');
  }

  // ── Actions ────────────────────────────────────────────────────
  function createNewGame() {
    socket.emit('join-game', null);
  }

  function joinExistingGame() {
    const val = document.getElementById('roomInput').value.trim();
    if (!val) { alert('Please enter a Room ID'); return; }
    socket.emit('join-game', val);
  }

  function makeMove(cellIndex) {
    if (!isMyTurn || gameBoard[cellIndex] !== null || !currentRoomId) return;
    socket.emit('make-move', { roomId: currentRoomId, cellIndex });
  }

  function playAgain() {
    if (currentRoomId) socket.emit('reset-game', currentRoomId);
  }

  function cancelWait() {
    newGame();
  }

  function newGame() {
    currentRoomId = null;
    mySymbol      = null;
    isMyTurn      = false;
    gameBoard     = Array(9).fill(null);
    document.getElementById('roomInput').value = '';
    showScreen('joinScreen');
    setStatus('ready', true);
  }

  // ── Socket events ──────────────────────────────────────────────
  socket.on('connect', () => {
    setStatus('ready', true);

    // Auto-join from URL param
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get('room');
    if (roomParam) socket.emit('join-game', roomParam);
  });

  socket.on('disconnect', () => setStatus('disconnected', false));

  socket.on('game-joined', (data) => {
    currentRoomId = data.roomId;
    mySymbol      = data.symbol;
    isMyTurn      = data.isYourTurn;
    gameBoard     = Array(9).fill(null);

    // If we're the first player, go to wait screen so opponent can scan QR
    if (!data.isYourTurn && mySymbol === 'X') {
      // Creator waits → show wait screen with QR
      document.getElementById('waitRoomCode').textContent = currentRoomId;
      generateQRCode(currentRoomId);
      showScreen('waitScreen');
      setStatus('waiting · ' + currentRoomId, true);
    } else {
      // Joiner goes straight to game
      document.getElementById('gameRoomCode').textContent = currentRoomId;
      updateBoard();
      updateTurnIndicators();
      setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
      showScreen('gameScreen');
      setStatus('playing · ' + currentRoomId, true);
    }
  });

  socket.on('opponent-joined', (data) => {
    // Creator: opponent arrived, hide wait screen, show game
    isMyTurn = data.isYourTurn;
    document.getElementById('gameRoomCode').textContent = currentRoomId;
    updateBoard();
    updateTurnIndicators();
    setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
    showScreen('gameScreen');
    setStatus('playing · ' + currentRoomId, true);
  });

  socket.on('game-start', (data) => {
    isMyTurn = data.currentPlayer === mySymbol;
    updateTurnIndicators();
    setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
  });

  socket.on('move-made', (data) => {
    gameBoard = data.board;
    isMyTurn  = data.currentPlayer === mySymbol;
    updateBoard();
    updateTurnIndicators();
    setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
  });

  socket.on('game-over', (data) => {
    gameBoard = data.board;
    updateBoard();
    disableBoard();
    showResult(data.winner);
  });

  socket.on('game-reset', (data) => {
    gameBoard = Array(9).fill(null);
    if (data.mySymbol) mySymbol = data.mySymbol;
    isMyTurn = data.currentPlayer === mySymbol;
    document.getElementById('gameRoomCode').textContent = currentRoomId;
    updateBoard();
    enableBoard();
    updateTurnIndicators();
    setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
    showScreen('gameScreen');
    setStatus('playing · ' + currentRoomId, true);
  });

  socket.on('opponent-left', () => {
    disableBoard();
    setGameMsg('opponent left', false);
    setStatus('opponent left', false);
  });

  socket.on('join-error', (data) => alert(data.message));
  socket.on('move-error', (data) => console.warn(data.message));

  // Enter key to join
  document.getElementById('roomInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') joinExistingGame();
  });

  // ── Theme toggle ───────────────────────────────────────────────
  const root = document.documentElement;
  let isLight = localStorage.getItem('ttt-theme') === 'light';

  function applyTheme() {
    if (isLight) {
      root.classList.add('light');
      document.getElementById('themeIcon').textContent = '●';
      document.getElementById('themeLabel').textContent = 'dark';
    } else {
      root.classList.remove('light');
      document.getElementById('themeIcon').textContent = '○';
      document.getElementById('themeLabel').textContent = 'light';
    }
    localStorage.setItem('ttt-theme', isLight ? 'light' : 'dark');
  }

  function toggleTheme() {
    isLight = !isLight;
    applyTheme();
  }

  applyTheme();
</script>
</body>
</html>
