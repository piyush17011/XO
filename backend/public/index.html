<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>XO.io — Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #191919;
      --border: #2a2a2a;
      --text: #d1d0c5;
      --muted: #646669;
      --strong: #e2e2e2;
      --copy-hint: #3a3a3a;
      --turn-inactive: #2a2a2a;
      --font-mono: 'Roboto Mono', monospace;
      --font-display: 'Space Mono', monospace;
      --t: background 0.25s, color 0.25s, border-color 0.25s;
    }

    :root.light {
      --bg: #f0efeb;
      --surface: #e4e3de;
      --border: #c9c8c3;
      --text: #3a3a35;
      --muted: #8a8985;
      --strong: #1a1a18;
      --copy-hint: #b0afaa;
      --turn-inactive: #c9c8c3;
    }

    html, body { height: 100%; transition: var(--t); }

    body {
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1rem;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* header */
    .header { display: flex; justify-content: space-between; align-items: center; }

    .logo {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--strong);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--muted); }

    .header-right { display: flex; align-items: center; gap: 14px; }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-height: auto;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    .theme-toggle:hover { border-color: var(--muted); color: var(--text); }

    .status-pill { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
    .status-pill.online { color: var(--text); }

    /* screens */
    .screen { display: none; flex-direction: column; align-items: center; gap: 1.25rem; width: 100%; }
    .screen.active { display: flex; }

    .label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-align: center; }

    /* buttons */
    button {
      font-family: var(--font-mono);
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 18px;
      min-height: 40px;
    }
    .btn:hover { border-color: var(--muted); color: var(--text); }
    .btn.primary { border-color: var(--text); color: var(--text); }
    .btn.primary:hover { background: var(--text); color: var(--bg); }
    .btn.full { width: 100%; }

    /* input */
    .input-row { display: flex; gap: 8px; width: 100%; }

    input[type="text"] {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 14px;
      outline: none;
      letter-spacing: 3px;
      text-transform: uppercase;
      min-height: 40px;
      -webkit-appearance: none;
    }
    input[type="text"]::placeholder { color: var(--muted); letter-spacing: 0; text-transform: none; }
    input[type="text"]:focus { border-color: var(--text); }

    /* divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* wait screen */
    .room-big {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--strong);
      letter-spacing: 8px;
      text-align: center;
    }

    .copy-link {
      font-size: 11px;
      color: var(--copy-hint);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
      min-height: auto;
    }
    .copy-link:hover { color: var(--muted); }

    .dots-loader { display: flex; gap: 6px; align-items: center; }
    .dots-loader span {
      width: 5px; height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    .dots-loader span:nth-child(2) { animation-delay: 0.2s; }
    .dots-loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* QR */
    .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }

    .qr-box {
      background: #ffffff;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      flex-shrink: 0;
    }
    .qr-box img { width: 120px; height: 120px; display: block; }

    /* game */
    .turn-row { display: flex; gap: 28px; }

    .turn-player {
      color: var(--turn-inactive);
      transition: color 0.2s;
      padding-bottom: 3px;
      background: none;
      border: none;
      cursor: default;
      min-height: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .turn-player.active { color: var(--text); border-bottom: 1px solid var(--text); }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--surface);
      border-radius: 10px;
      padding: 4px;
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1;
    }

    .cell {
      background: var(--bg);
      border: none;
      border-radius: 7px;
      font-family: var(--font-display);
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      min-height: unset;
    }
    .cell:hover:not(:disabled):not(.filled) { background: var(--surface); }
    .cell:disabled { cursor: default; }
    .cell.x-sym { color: var(--strong); }
    .cell.o-sym { color: var(--muted); }

    .game-msg { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; min-height: 16px; text-align: center; }
    .game-msg.active { color: var(--text); }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

    /* result */
    .result-word {
      font-family: var(--font-display);
      font-size: clamp(36px, 12vw, 56px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
    }
    .result-word.win  { color: var(--strong); }
    .result-word.lose { color: var(--border); }
    .result-word.draw { color: var(--muted); }
    .result-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }

    /* room badge */
    .room-badge { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
    .room-badge strong { font-family: var(--font-display); font-size: 13px; color: var(--text); letter-spacing: 3px; }

    @media (max-width: 400px) { body { padding: 0.75rem; } .board { max-width: 260px; } }
    @media (max-height: 640px) { .app { gap: 1rem; } }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">XO<span>.</span>io</div>
    <div class="header-right">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">○</span>
        <span id="themeLabel">light</span>
      </button>
      <div class="status-pill" id="statusPill">connecting</div>
    </div>
  </div>

  <!-- Join -->
  <div class="screen active" id="joinScreen">
    <div class="label">create a new game</div>
    <button class="btn primary full" onclick="createNewGame()">new game</button>
    <div class="divider">or join existing</div>
    <div class="input-row">
      <input type="text" id="roomInput" placeholder="enter room id" maxlength="6" />
      <button class="btn" onclick="joinExistingGame()">join</button>
    </div>
  </div>

  <!-- Wait (creator only) -->
  <div class="screen" id="waitScreen">
    <div class="label">share this room id</div>
    <div class="room-big" id="waitRoomCode">——</div>
    <button class="copy-link" id="copyBtn" onclick="copyRoomLink()">[ click to copy invite link ]</button>
    <div class="qr-wrap">
      <div class="label">or scan to join</div>
      <div class="qr-box" id="qrBox">
        <span style="font-size:11px;color:#aaa">loading…</span>
      </div>
    </div>
    <div class="dots-loader"><span></span><span></span><span></span></div>
    <div class="label">waiting for opponent</div>
    <button class="btn" onclick="cancelWait()">cancel</button>
  </div>

  <!-- Game -->
  <div class="screen" id="gameScreen">
    <div class="room-badge">room <strong id="gameRoomCode">——</strong></div>
    <div class="turn-row">
      <button class="turn-player" id="yourTurnEl">you (X)</button>
      <button class="turn-player" id="oppTurnEl">opponent (O)</button>
    </div>
    <div class="board">
      <button class="cell" onclick="makeMove(0)"></button>
      <button class="cell" onclick="makeMove(1)"></button>
      <button class="cell" onclick="makeMove(2)"></button>
      <button class="cell" onclick="makeMove(3)"></button>
      <button class="cell" onclick="makeMove(4)"></button>
      <button class="cell" onclick="makeMove(5)"></button>
      <button class="cell" onclick="makeMove(6)"></button>
      <button class="cell" onclick="makeMove(7)"></button>
      <button class="cell" onclick="makeMove(8)"></button>
    </div>
    <div class="game-msg" id="gameMsg">—</div>
    <div class="action-row">
      <button class="btn" onclick="newGame()">home</button>
    </div>
  </div>

  <!-- Result -->
  <div class="screen" id="resultScreen">
    <div class="result-word" id="resultWord">draw</div>
    <div class="result-sub" id="resultSub">game over</div>
    <div class="action-row">
      <button class="btn primary" onclick="playAgain()">play again</button>
      <button class="btn" onclick="newGame()">home</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  let currentRoomId = null;
  let mySymbol      = null;
  let isMyTurn      = false;
  let gameBoard     = Array(9).fill(null);
  let isCreator     = false;

  // screens
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function setStatus(txt, online) {
    const el = document.getElementById('statusPill');
    el.textContent = txt;
    el.className = 'status-pill' + (online ? ' online' : '');
  }

  // QR
  function generateQRCode(roomId) {
    const url = `${location.origin}${location.pathname}?room=${roomId}`;
    const api = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(url)}&color=000000&bgcolor=ffffff&margin=1`;
    const box = document.getElementById('qrBox');
    box.innerHTML = '<span style="font-size:11px;color:#aaa">loading…</span>';
    const img = new Image(120, 120);
    img.alt = 'QR code';
    img.onload  = () => { box.innerHTML = ''; box.appendChild(img); };
    img.onerror = () => { box.innerHTML = `<span style="font-size:11px;color:#aaa">unavailable<br><b>${roomId}</b></span>`; };
    img.src = api;
  }

  function copyRoomLink() {
    const url = `${location.origin}${location.pathname}?room=${currentRoomId}`;
    navigator.clipboard?.writeText(url).then(() => {
      const btn = document.getElementById('copyBtn');
      const orig = btn.textContent;
      btn.textContent = '[ copied! ]';
      setTimeout(() => btn.textContent = orig, 1800);
    });
  }

  // board
  function cells() { return document.querySelectorAll('.cell'); }

  function updateBoard() {
    cells().forEach((cell, i) => {
      const v = gameBoard[i];
      cell.textContent = v || '';
      cell.className   = 'cell' + (v ? ' filled' : '') + (v === 'X' ? ' x-sym' : v === 'O' ? ' o-sym' : '');
      cell.disabled    = !!v || !isMyTurn;
    });
  }

  function enableBoard()  { cells().forEach((c, i) => { if (!gameBoard[i]) c.disabled = !isMyTurn; }); }
  function disableBoard() { cells().forEach(c => c.disabled = true); }

  // turn UI
  function updateTurnIndicators() {
    const opp = mySymbol === 'X' ? 'O' : 'X';
    const you = document.getElementById('yourTurnEl');
    const op  = document.getElementById('oppTurnEl');
    you.textContent = `you (${mySymbol})`;
    op.textContent  = `opponent (${opp})`;
    you.classList.toggle('active',  isMyTurn);
    op.classList.toggle('active',  !isMyTurn);
  }

  function setGameMsg(txt, hi) {
    const el = document.getElementById('gameMsg');
    el.textContent = txt;
    el.className   = 'game-msg' + (hi ? ' active' : '');
  }

  // result
  function showResult(winner) {
    const cfg = winner === 'draw'
      ? { type: 'draw', word: 'draw',   sub: "it's a draw" }
      : winner === mySymbol
        ? { type: 'win',  word: 'gg ez',  sub: 'you won!' }
        : { type: 'lose', word: 'rekt',   sub: 'you lost' };
    document.getElementById('resultWord').textContent = cfg.word;
    document.getElementById('resultWord').className   = `result-word ${cfg.type}`;
    document.getElementById('resultSub').textContent  = cfg.sub;
    showScreen('resultScreen');
  }

  // navigation helpers
  function goWait(roomId) {
    document.getElementById('waitRoomCode').textContent = roomId;
    generateQRCode(roomId);         // <-- always called when creator waits
    showScreen('waitScreen');
    setStatus('waiting · ' + roomId, true);
  }

  function goGame() {
    document.getElementById('gameRoomCode').textContent = currentRoomId;
    updateBoard();
    updateTurnIndicators();
    setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
    showScreen('gameScreen');
    setStatus('playing · ' + currentRoomId, true);
  }

  // actions
  function createNewGame()    { isCreator = true;  socket.emit('join-game', null); }
  function cancelWait()       { isCreator = false; newGame(); }

  function joinExistingGame() {
    const val = document.getElementById('roomInput').value.trim();
    if (!val) { alert('Please enter a Room ID'); return; }
    isCreator = false;
    socket.emit('join-game', val);
  }

  function makeMove(i) {
    if (!isMyTurn || gameBoard[i] !== null || !currentRoomId) return;
    socket.emit('make-move', { roomId: currentRoomId, cellIndex: i });
  }

  function playAgain() { if (currentRoomId) socket.emit('reset-game', currentRoomId); }

  function newGame() {
    currentRoomId = mySymbol = null;
    isMyTurn = isCreator = false;
    gameBoard = Array(9).fill(null);
    document.getElementById('roomInput').value = '';
    showScreen('joinScreen');
    setStatus('ready', true);
  }

  // socket
  socket.on('connect', () => {
    setStatus('ready', true);
    const room = new URLSearchParams(location.search).get('room');
    if (room) { isCreator = false; socket.emit('join-game', room); }
  });

  socket.on('disconnect', () => setStatus('disconnected', false));

  socket.on('game-joined', (data) => {
    currentRoomId = data.roomId;
    mySymbol      = data.symbol;
    isMyTurn      = data.isYourTurn;
    gameBoard     = Array(9).fill(null);

    // Use isCreator flag — not the symbol — to decide routing.
    // This avoids the brittle "X goes first" assumption.
    if (isCreator) {
      goWait(currentRoomId);   // show QR while waiting
    } else {
      goGame();                 // joiner goes straight in
    }
  });

  socket.on('opponent-joined', () => {
    // server sends this to creator; isYourTurn is in game-start
    // just move creator off wait screen
    goGame();
  });

  socket.on('game-start', (data) => {
    isMyTurn = data.currentPlayer === mySymbol;
    updateTurnIndicators();
    setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
  });

  socket.on('move-made', (data) => {
    gameBoard = data.board;
    isMyTurn  = data.currentPlayer === mySymbol;
    updateBoard();
    updateTurnIndicators();
    setGameMsg(isMyTurn ? 'your turn' : "opponent's turn", isMyTurn);
  });

  socket.on('game-over', (data) => {
    gameBoard = data.board;
    updateBoard();
    disableBoard();
    showResult(data.winner);
  });

  socket.on('game-reset', (data) => {
    gameBoard = Array(9).fill(null);
    if (data.mySymbol) mySymbol = data.mySymbol;
    isMyTurn = data.currentPlayer === mySymbol;
    enableBoard();
    goGame();
  });

  socket.on('opponent-left', () => {
    disableBoard();
    setGameMsg('opponent left', false);
    setStatus('opponent left', false);
  });

  socket.on('join-error',  d => alert(d.message));
  socket.on('move-error',  d => console.warn(d.message));

  document.getElementById('roomInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') joinExistingGame();
  });

  // theme
  const root = document.documentElement;
  let isLight = localStorage.getItem('ttt-theme') === 'light';

  function applyTheme() {
    root.classList.toggle('light', isLight);
    document.getElementById('themeIcon').textContent  = isLight ? '●' : '○';
    document.getElementById('themeLabel').textContent = isLight ? 'dark' : 'light';
    localStorage.setItem('ttt-theme', isLight ? 'light' : 'dark');
  }

  function toggleTheme() { isLight = !isLight; applyTheme(); }

  applyTheme();
</script>
</body>
</html>
